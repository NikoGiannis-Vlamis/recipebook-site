<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Recipe Book — a small recipe manager demo. Add recipes, search by ingredient, and view step-by-step instructions, backed by a relational schema (recipes/ingredients/steps) in the full Flask + SQLite version.">
<title>Recipe Book — Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="#" class="logo" id="logo-link">📖 Recipe Book</a>
  <nav>
    <button type="button" id="nav-list" class="nav-btn active">All recipes</button>
    <button type="button" id="nav-add" class="nav-btn">+ New recipe</button>
  </nav>
</header>

<main>
  <section id="view-list">
    <form id="search-form" class="search-form">
      <input type="text" id="search-input" placeholder="Search by ingredient...">
      <button type="submit">Search</button>
      <button type="button" id="clear-search" class="ghost" hidden>clear</button>
    </form>
    <h2 id="list-heading">All recipes</h2>
    <ul id="recipe-list" class="recipe-list"></ul>
    <p id="empty-msg" class="empty" hidden>No recipes found.</p>
  </section>

  <section id="view-detail" hidden>
    <button type="button" class="back-link" id="back-to-list">&larr; Back to all recipes</button>
    <h2 id="detail-name"></h2>
    <h3>Ingredients</h3>
    <ul id="detail-ingredients"></ul>
    <h3>Instructions</h3>
    <ol id="detail-steps"></ol>
    <button type="button" id="delete-btn" class="danger">Delete recipe</button>
  </section>

  <section id="view-add" hidden>
    <h2>New recipe</h2>
    <p id="add-error" class="error" hidden></p>
    <form id="add-form" class="recipe-form">
      <label for="name">Recipe name</label>
      <input type="text" id="name" required>

      <label for="ingredients">Ingredients (one per line)</label>
      <textarea id="ingredients" rows="6" placeholder="tomato&#10;pasta&#10;basil" required></textarea>

      <label for="steps">Steps (one per line, in order)</label>
      <textarea id="steps" rows="6" placeholder="Boil the pasta&#10;Make the sauce&#10;Mix everything together" required></textarea>

      <button type="submit">Save recipe</button>
    </form>
  </section>
</main>

<footer>
  <p>Recipe Book — client-side demo, data is saved only in this browser (localStorage).
  Full version: Flask + SQLite with a normalized schema and SQL joins.
  <a href="https://github.com/NikoGiannis-Vlamis" target="_blank" rel="noopener">More projects on GitHub</a></p>
</footer>

<script src="script.js"></script>
</body>
</html>
